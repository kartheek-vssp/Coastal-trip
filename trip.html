<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Coastal Trip | Adventure Map</title>
    <style>
        :root {
            --bg-dark: #05080a;
            --accent-active: #ff8c00;
            --accent-done: #00ff88;
            --accent-future: #00d4ff;
            --glass: rgba(15, 20, 25, 0.98);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #e0e0e0;
            --font-primary: 'Inter', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-dark); color: var(--text-main); font-family: var(--font-primary); overflow-x: hidden; scroll-behavior: smooth; }

        /* HERO SECTION */
        #hero { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: radial-gradient(circle at center, #101a20 0%, #05080a 100%); z-index: 100; position: fixed; width: 100%; transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1); top: 0; }
        .hero-title { font-size: 3.5rem; font-weight: 900; background: linear-gradient(to bottom, #fff 30%, #444 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
        .hero-names { font-size: 0.8rem; color: var(--accent-future); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 40px; }
        .btn-begin { padding: 18px 48px; background: linear-gradient(45deg, #00d4ff, #0055ff); border: none; border-radius: 50px; color: white; font-weight: 700; font-size: 1.1rem; box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3); cursor: pointer; }

        /* CONTENT WRAPPER */
        #experience { 
            opacity: 0; transition: opacity 1s; position: relative; padding-bottom: 100px;
            background-image: url('https://www.transparenttextures.com/patterns/stardust.png'), linear-gradient(rgba(5,8,10,0.8), rgba(5,8,10,0.8)), url('https://images.unsplash.com/photo-1524661135-423995f22d0b?auto=format&fit=crop&w=1200&q=80');
            background-size: auto, auto, cover; background-attachment: fixed;
        }
        .journey-container { position: relative; width: 100%; max-width: 450px; margin: 0 auto; z-index: 5; }
        svg#map-svg { width: 100%; height: 2000px; overflow: visible; }
        .route-base { fill: none; stroke: rgba(255, 255, 255, 0.1); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 10, 10; }
        .route-glow { fill: none; stroke: var(--accent-done); stroke-width: 5; stroke-linecap: round; filter: drop-shadow(0 0 12px var(--accent-done)); transition: stroke-dashoffset 0.1s linear; }
        
        .node-group { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; z-index: 20; cursor: pointer; }
        .node-circle { width: 22px; height: 22px; border-radius: 50%; background: #111; border: 3px solid #333; transition: 0.3s; }
        .node-label { margin-top: 12px; font-size: 0.8rem; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; color: #888; transition: 0.3s; }
        .node-active .node-circle { background: var(--accent-active); border-color: #fff; box-shadow: 0 0 25px var(--accent-active); }
        .node-active .node-label { color: #fff; text-shadow: 0 0 10px var(--accent-active); }
        .node-completed .node-circle { background: var(--accent-done); border-color: var(--accent-done); }
        
        #vehicle { position: absolute; z-index: 60; font-size: 32px; display: none; filter: drop-shadow(0 0 10px white); transform-origin: center; transition: transform 0.2s; }

        /* UI ELEMENTS */
        #sheet-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); z-index: 900; display: none; opacity: 0; transition: 0.4s; }
        #bottom-sheet { position: fixed; bottom: -100%; left: 0; width: 100%; background: var(--glass); border-top: 1px solid var(--glass-border); border-radius: 32px 32px 0 0; padding: 25px 0; z-index: 1000; transition: bottom 0.6s cubic-bezier(0.16, 1, 0.3, 1); color: white; max-height: 92vh; overflow-y: auto; }
        .sheet-active { bottom: 0 !important; }
        
        .padding-wrap { padding: 0 20px; }
        .lead-tag { background: rgba(0, 212, 255, 0.15); color: var(--accent-future); padding: 4px 12px; border-radius: 6px; font-size: 11px; font-weight: 700; margin-bottom: 8px; display: inline-block; }
        .section-header { font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: 1.5px; color: #666; margin: 25px 20px 15px; display: flex; align-items: center; }
        .section-header::after { content: ""; flex: 1; height: 1px; background: rgba(255,255,255,0.1); margin-left: 15px; }

        .pointer-card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); padding: 15px 20px; border-radius: 18px; display: flex; align-items: center; gap: 15px; margin: 0 20px 10px; }
        .pointer-emoji { font-size: 22px; }
        .pointer-text { font-size: 14px; font-weight: 500; color: #ddd; }

        .img-container { display: flex; overflow-x: auto; gap: 12px; padding: 0 20px 5px; }
        .img-container::-webkit-scrollbar { display: none; }
        .clean-img-card { flex: 0 0 280px; height: 180px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.1); background-size: cover; background-position: center; }

        .calc-form { display: flex; flex-direction: column; gap: 15px; padding: 20px; }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 11px; font-weight: 700; color: var(--accent-future); text-transform: uppercase; }
        .input-group input { background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 12px; padding: 15px; color: white; font-size: 16px; outline: none; }
        .calc-btn { background: var(--accent-done); color: black; border: none; padding: 20px; border-radius: 18px; font-weight: 900; margin-top: 10px; cursor: pointer; }
        #calc-result { margin-top: 20px; padding: 20px; background: rgba(0, 255, 136, 0.1); border: 1px solid var(--accent-done); border-radius: 20px; display: none; }

        footer { text-align: center; padding: 60px 20px; background: rgba(0,0,0,0.5); margin-top: 40px; border-top: 1px solid var(--glass-border); }
        .thanks-text { font-size: 1rem; color: #666; letter-spacing: 4px; text-transform: uppercase; }
    </style>
</head>
<body>

    <section id="hero">
        <h1 class="hero-title">Trip With Gang</h1>
        <p class="hero-names">Harsha • Pooja • Athulith • Subbu • Kartheek</p>
        <button class="btn-begin" onclick="beginJourney()">Begin Journey</button>
    </section>

    <section id="experience">
        <div class="journey-container">
            <svg id="map-svg" viewBox="0 0 400 2000">
                <path id="route-path" class="route-base" d="M200,100 C350,300 50,500 200,700 C350,900 50,1100 200,1300 C350,1500 50,1650 200,1750 L200,1900" />
                <path id="route-glow" class="route-glow" d="M200,100 C350,300 50,500 200,700 C350,900 50,1100 200,1300 C350,1500 50,1650 200,1750 L200,1900" />
            </svg>
            <div id="vehicle">🚗</div>
        </div>

        <footer>
            <div class="thanks-text">Thank You for Joining the Crew</div>
        </footer>
    </section>

    <div id="sheet-overlay" onclick="closeSheet()"></div>
    <div id="bottom-sheet">
        <div style="width: 40px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; margin: 0 auto 20px;"></div>
        <div class="padding-wrap">
            <div id="lead-display" class="lead-tag"></div>
            <h2 id="sheet-title" style="font-size: 2.2rem; margin-bottom: 20px;"></h2>
        </div>
        <div id="standard-content">
            <div class="img-container" id="main-images"></div>
            <div class="section-header">Places to Cover</div>
            <div id="places-list"></div>
            <div class="section-header">Trip Activities</div>
            <div id="todo-list"></div>
        </div>
        <div id="calculator-content" style="display: none;">
            <div class="calc-form">
                <div class="input-group"><label>Flights (/Person)</label><input type="number" id="calc-flights" placeholder="0"></div>
                <div class="input-group"><label>Stay (/Person)</label><input type="number" id="calc-stay" placeholder="0"></div>
                <div class="input-group"><label>Food (/Person)</label><input type="number" id="calc-food" placeholder="0"></div>
                <div class="input-group"><label>Commute (/Couple)</label><input type="number" id="calc-commute" placeholder="0"></div>
                <button class="calc-btn" onclick="calculateBudget()">SUBMIT CALCULATION</button>
                <div id="calc-result">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 10px;"><span>Per Person:</span><b id="result-per-person">₹0</b></div>
                    <div style="display: flex; justify-content: space-between;"><span>Total (5):</span><b id="result-total">₹0</b></div>
                </div>
            </div>
        </div>
        <div class="padding-wrap">
            <button onclick="closeSheet()" id="continue-btn" style="width: 100%; margin-top: 25px; padding: 20px; background: white; border: none; color: black; border-radius: 22px; font-weight: 900;">CONTINUE JOURNEY</button>
        </div>
    </div>

    <script>
        const destinations = [
            { name: "Hyderabad", pos: 0, status: 'completed', lead: 'Harsha' },
            { name: "Hubli", pos: 0.18, status: 'upcoming', lead: 'Pooja', mainImgs: ["https://images.unsplash.com/photo-1600100397561-4339985791ed?w=600", "https://images.unsplash.com/photo-1622325375960-9ba249110006?w=600"], places: [{t:"Unkal Lake", e:"🌅"}, {t:"Glass House", e:"🌿"}], todo: [{t:"Sunset View", e:"📸"}, {t:"Breakfast", e:"🥞"}] },
            { name: "Dandeli", pos: 0.36, status: 'upcoming', lead: 'Athulith', mainImgs: ["https://images.unsplash.com/photo-1590490359854-dfba19688d70?w=600", "https://images.unsplash.com/photo-1542601906990-b4d3fb778b09?w=600"], places: [{t:"Kali River", e:"💧"}, {t:"Supa Dam", e:"🌊"}], todo: [{t:"Rafting", e:"🛶"}, {t:"Safari", e:"🐅"}] },
            { name: "Gokarna", pos: 0.54, status: 'upcoming', lead: 'Subbu', mainImgs: ["https://images.unsplash.com/photo-1590523277543-a94d2e4eb00b?w=600", "https://images.unsplash.com/photo-1563821013405-f37648f5727d?w=600"], places: [{t:"Om Beach", e:"🕉️"}, {t:"Paradise", e:"🏝️"}], todo: [{t:"Beach Trek", e:"🥾"}, {t:"Cafe Hopping", e:"☕"}] },
            { name: "Murudeshwar", pos: 0.72, status: 'upcoming', lead: 'Kartheek', mainImgs: ["https://images.unsplash.com/photo-1621255194488-8b9016147496?w=600", "https://images.unsplash.com/photo-1544551763-46a013bb70d5?w=600"], places: [{t:"Temple", e:"⛩️"}, {t:"Netrani", e:"🏝️"}], todo: [{t:"Scuba", e:"🤿"}, {t:"Boat Ride", e:"🚤"}] },
            { name: "Udupi", pos: 0.90, status: 'upcoming', lead: 'Gang', mainImgs: ["https://images.unsplash.com/photo-1605335832367-9614c2787e68?w=600", "https://images.unsplash.com/photo-1596402184320-417d717867cd?w=600"], places: [{t:"Malpe Beach", e:"🏖️"}, {t:"Krishna Temple", e:"🛕"}], todo: [{t:"Island Boat", e:"⛴️"}, {t:"Surfing", e:"🏄"}] },
            { name: "Budget", pos: 1.0, status: 'upcoming', lead: 'Gang', isCalc: true }
        ];

        let currentIndex = 0;
        const path = document.getElementById('route-path');
        const glow = document.getElementById('route-glow');
        const length = path.getTotalLength();

        function beginJourney() {
            document.getElementById('hero').style.transform = 'translateY(-100%)';
            document.getElementById('experience').style.opacity = '1';
            glow.style.strokeDasharray = length;
            glow.style.strokeDashoffset = length;
            renderNodes();
            currentIndex = 1;
            animateTravel(0, destinations[1].pos, true);
        }

        function renderNodes() {
            document.querySelectorAll('.node-group').forEach(n => n.remove());
            destinations.forEach((d, i) => {
                const pt = path.getPointAtLength(d.pos * length);
                const node = document.createElement('div');
                node.className = `node-group node-${d.status}`;
                if (i === currentIndex) node.classList.add('node-active');
                node.style.left = `${pt.x}px`;
                node.style.top = `${pt.y}px`;
                node.innerHTML = `<div class="node-circle"></div><div class="node-label">${d.name}</div>`;
                node.onclick = () => openSheet(d);
                document.querySelector('.journey-container').appendChild(node);
            });
        }

        function openSheet(dest) {
            document.getElementById('sheet-title').innerText = dest.isCalc ? "Budget Calculator" : dest.name;
            document.getElementById('lead-display').innerText = `ROUTE LEAD: ${dest.lead.toUpperCase()}`;
            if (dest.isCalc) {
                document.getElementById('standard-content').style.display = 'none';
                document.getElementById('calculator-content').style.display = 'block';
                document.getElementById('continue-btn').innerText = "FINISH TRIP";
            } else {
                document.getElementById('standard-content').style.display = 'block';
                document.getElementById('calculator-content').style.display = 'none';
                document.getElementById('continue-btn').innerText = "CONTINUE JOURNEY";
                document.getElementById('main-images').innerHTML = (dest.mainImgs || []).map(url => `<div class="clean-img-card" style="background-image: url('${url}');"></div>`).join('');
                document.getElementById('places-list').innerHTML = (dest.places || []).map(p => `<div class="pointer-card"><span class="pointer-emoji">${p.e}</span><span class="pointer-text">${p.t}</span></div>`).join('');
                document.getElementById('todo-list').innerHTML = (dest.todo || []).map(a => `<div class="pointer-card"><span class="pointer-emoji">${a.e}</span><span class="pointer-text">${a.t}</span></div>`).join('');
            }
            document.getElementById('sheet-overlay').style.display = 'block';
            setTimeout(() => { document.getElementById('sheet-overlay').style.opacity = '1'; document.getElementById('bottom-sheet').classList.add('sheet-active'); }, 10);
        }

        function calculateBudget() {
            const f = parseFloat(document.getElementById('calc-flights').value) || 0;
            const s = parseFloat(document.getElementById('calc-stay').value) || 0;
            const fd = parseFloat(document.getElementById('calc-food').value) || 0;
            const c = parseFloat(document.getElementById('calc-commute').value) || 0;
            const per = f + s + fd + (c / 2);
            document.getElementById('result-per-person').innerText = `₹${per.toLocaleString()}`;
            document.getElementById('result-total').innerText = `₹${(per * 5).toLocaleString()}`;
            document.getElementById('calc-result').style.display = 'block';
        }

        function closeSheet() {
            const isCalc = destinations[currentIndex].isCalc;
            document.getElementById('bottom-sheet').classList.remove('sheet-active');
            document.getElementById('sheet-overlay').style.opacity = '0';
            setTimeout(() => { 
                document.getElementById('sheet-overlay').style.display = 'none';
                if (isCalc) {
                    // Revert Hero Section
                    document.getElementById('hero').style.transform = 'translateY(0)';
                } else if (currentIndex < destinations.length - 1) {
                    const start = destinations[currentIndex].pos;
                    currentIndex++;
                    animateTravel(start, destinations[currentIndex].pos);
                }
            }, 400);
        }

        function animateTravel(s, e, isFlight = false) {
            const v = document.getElementById('vehicle');
            v.innerText = isFlight ? '✈️' : '🚗';
            v.style.display = 'block';
            let start = null;
            function step(t) {
                if (!start) start = t;
                const p = Math.min((t - start) / 2000, 1);
                const cur = s + (e - s) * (1 - Math.pow(1 - p, 3));
                const pt = path.getPointAtLength(cur * length);
                v.style.left = `${pt.x - 16}px`; v.style.top = `${pt.y - 16}px`;
                window.scrollTo({ top: pt.y - window.innerHeight / 2 });
                glow.style.strokeDashoffset = length - (length * cur);
                if (p < 1) requestAnimationFrame(step); else { v.style.display = 'none'; renderNodes(); }
            }
            requestAnimationFrame(step);
        }
    </script>
</body>
</html>
